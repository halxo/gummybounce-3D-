<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gummy Bounce Arena 2 (4D) — Quantum Tesseract Edition</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="../audio.js"></script>
  <script defer src="../mesh3d.js"></script>
  <script defer src="arena2-4d.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <a href="../index.html" class="back-link" title="Back to Gummy Bounce 3D">← 3D Arena</a>
      <div class="brand-badge">
        <span class="brand-icon" aria-hidden="true">💠</span>
        <div class="brand-text">
          <h1>GUMMY BOUNCE <span class="badge-4d">4D ARENA 2</span></h1>
          <p class="subtitle">Quantum Tesseract Soft-Body Physics</p>
        </div>
      </div>
    </div>

    <div class="hud-stats">
      <span class="stat-pill">🎯 <strong id="score-4d">0</strong></span>
      <span class="stat-pill w-pill">🌌 W: <strong id="w-slice-val">0.0</strong></span>
      <span class="stat-pill">🧸 <strong id="bears-4d">0</strong></span>
    </div>

    <div class="action-bar">
      <button type="button" id="btn-drop-4d" class="action-btn primary" title="Drop 4D Bear (N)">＋ Drop</button>
      <button type="button" id="btn-quake-4d" class="action-btn yam" title="4D Yam Quake (Y)">🍠 Quake</button>
      <button type="button" id="btn-boss-4d" class="action-btn danger" title="Toggle 4D Obtuse Titan Boss (B)">👹 4D Boss</button>
      <button type="button" id="btn-chaos-4d" class="action-btn chaos" title="4D Hyper-Chaos">🎲 Chaos</button>
      <button type="button" id="btn-reset-cam-4d" class="icon-btn" title="Reset 4D Camera (R)">🎥</button>
    </div>
  </header>

  <main class="stage-wrap">
    <canvas id="canvas-4d"></canvas>

    <!-- 4D Hyper-Dimension Control Dock -->
    <aside class="w-dock" aria-label="4th Dimension Controls">
      <div class="w-title">🌌 4D Hyper-Controls</div>
      <label class="w-row">
        <span>W-Slice (<kbd>Q</kbd>/<kbd>E</kbd>): <strong id="w-slider-lbl">0.0</strong></span>
        <input type="range" id="slider-w" min="-50" max="50" value="0">
      </label>
      <div class="w-radar-wrap" title="Live 4D W-Dimension Radar: cyan/magenta dots show bears, red dot shows 4D Boss">
        <span class="w-radar-label">-5W</span>
        <div id="w-radar" class="w-radar">
          <div id="w-radar-cam" class="w-radar-cam"></div>
        </div>
        <span class="w-radar-label">+5W</span>
      </div>
      <label class="w-row">
        <span>XW Hyper-Rot: <strong id="xw-lbl">18°</strong></span>
        <input type="range" id="slider-xw" min="-180" max="180" value="18">
      </label>
      <label class="w-row">
        <span>ZW Hyper-Rot: <strong id="zw-lbl">-12°</strong></span>
        <input type="range" id="slider-zw" min="-180" max="180" value="-12">
      </label>
      <label class="w-toggle">
        <input type="checkbox" id="chk-auto-4d" checked> Auto-Rotate Tesseract
      </label>
    </aside>

    <!-- 4D Boss HP Bar -->
    <div id="boss-4d-hud" class="boss-4d-hud" hidden>
      <span>👹 4D OBTUSE TITAN (W: <strong id="boss-w-val">0.0</strong>)</span>
      <div class="hp-track"><div id="boss-4d-fill" class="hp-fill"></div></div>
      <strong id="boss-4d-hp">120 / 120</strong>
    </div>

    <div id="toast-4d" class="toast-4d" hidden></div>

    <!-- Sleek Bottom 4D Tool Dock -->
    <nav class="tool-dock" id="toolbar-4d" aria-label="4D Tools">
      <button type="button" class="tool-btn" data-mode="grab" aria-pressed="true" title="4D Grab & Throw (1)">✋<span>Grab</span></button>
      <button type="button" class="tool-btn" data-mode="slingshot" aria-pressed="false" title="4D Slingshot Aim & Launch (2)">🏹<span>Sling</span></button>
      <button type="button" class="tool-btn" data-mode="wave" aria-pressed="false" title="4D Hypersphere Shockwave (3)">〰️<span>Wave</span></button>
      <button type="button" class="tool-btn" data-mode="vortex" aria-pressed="false" title="4D Hyper-Vortex Tornado (4)">🌀<span>Vortex</span></button>
      <button type="button" class="tool-btn" data-mode="blaster" aria-pressed="false" title="4D Rapid Blaster (5)">🔫<span>Blaster</span></button>
      <button type="button" class="tool-btn" data-mode="puff" aria-pressed="false" title="Puff & Pop (6)">🎈<span>Puff</span></button>
      <button type="button" class="tool-btn" data-mode="cryo" aria-pressed="false" title="4D Cryo Freeze (7)">❄️<span>Cryo</span></button>
      <button type="button" class="tool-btn" data-mode="yams" aria-pressed="false" title="Steady 4D Yams Ray (8)">🍠<span>Yams</span></button>
      <button type="button" class="tool-btn" data-mode="blackhole" aria-pressed="false" title="4D Singularity Black Hole (9)">🕳️<span>4D Hole</span></button>
      <button type="button" class="tool-btn" data-mode="wzap" aria-pressed="false" title="Pull all bears into your W-Slice! (0)">⚡<span>W-Zap</span></button>
    </nav>

    <p class="hint-4d" id="hint-4d">
      <strong>1 · 4D Grab:</strong> Drag any bear to toss it! Use <kbd>Q</kbd>/<kbd>E</kbd> to phase-shift W-Slices, <strong>Right-drag</strong> to orbit 3D, <strong>Scroll</strong> to zoom.
    </p>
  </main>
</body>
</html>
